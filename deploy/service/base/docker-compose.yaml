services:
  easy-browser:
    build:
      context: ../../..
      dockerfile: deploy/service/base/Dockerfile
    image: ${EASYBROWSER_SERVICE_IMAGE:-easy-browser/easy-browser:local}
    container_name: ${EASYBROWSER_SERVICE_CONTAINER_NAME:-easy-browser}
    restart: unless-stopped
    env_file:
      - ${EASYBROWSER_SERVICE_ENV_FILE:-./.env.local}
    ports:
      - ${EASYBROWSER_SERVICE_HOST_PORT:-18080}:18080
    networks:
      easybrowser_service_network:
        aliases:
          - ${EASYBROWSER_SERVICE_NETWORK_ALIAS:-easy-browser}

networks:
  easybrowser_service_network:
    name: ${EASYBROWSER_SERVICE_NETWORK:-EasyAiMi}
    external: true
