name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: service/base/go.mod

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create Local Operator Config
        shell: pwsh
        run: Copy-Item config.example.yaml config.yaml

      - name: Run Repository Validation
        shell: pwsh
        run: .\scripts\test-all.ps1

      - name: Validate Release Contract
        shell: pwsh
        run: python scripts/validate-release-contract.py
