# Root operator config for EasyBrowser.
#
# This file is intentionally minimal during the planning phase. Real sections
# will be expanded as modules are imported into the monorepo.

serviceBase:
  runtime:
    listen: "127.0.0.1:18080"
    runtimePool:
      enabled: true
      reconcileSeconds: 5
      idleTimeoutSeconds: 120
      providers:
        chrome:
          minWarm: 1
        camoufox:
          minWarm: 0
        geekez:
          minWarm: 0
        browserbase:
          minWarm: 0

chromeRuntime:
  headless: true
  useUndetectedChromedriver: false
  binaryPath: ""
  chromedriverPath: ""
  pythonPath: ""

camoufoxRuntime:
  pythonPath: ""
  headless: true
  os: "windows"
  readyTimeoutMs: 75000

geekezRuntime:
  pythonPath: ""
  readyTimeoutMs: 90000

browserbase:
  apiKey: ""
  projectId: ""

publishing:
  ghcr:
    registry: "ghcr.io"
    namespace: ""
    imageName: "easybrowser-service"
  importCode:
    syncEnabled: true
    syncIntervalSeconds: 7200
